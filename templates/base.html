<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справочник DWH</title>

    <!-- ВОТ ЭТА СТРОКА ВЕРНЕТ ИКОНКУ -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%%22 y1=%220%%22 x2=%22100%%22 y2=%22100%%22><stop offset=%220%%22 stop-color=%22%2300D084%22/><stop offset=%22100%%22 stop-color=%22%230055FF%22/></linearGradient></defs><ellipse cx=%2250%22 cy=%2220%22 rx=%2245%22 ry=%2215%22 fill=%22url(%23g)%22/><path d=%22M5 20 v60 c0 8.3 20 15 45 15 s45-6.7 45-15 v-60%22 fill=%22url(%23g)%22 opacity=%220.9%22/><path d=%22M5 45 c0 8.3 20 15 45 15 s45-6.7 45-15%22 fill=%22none%22 stroke=%22white%22 stroke-width=%221.5%22 opacity=%220.4%22/><path d=%22M5 70 c0 8.3 20 15 45 15 s45-6.7 45-15%22 fill=%22none%22 stroke=%22white%22 stroke-width=%221.5%22 opacity=%220.4%22/></svg>">

    <!-- CSS как внешний файл -->
    <link rel="stylesheet" href="static/style.css?v={{ build_version or '1' }}">
</head>

<body>
    <!-- Полоса загрузки: показывается сразу, скрывается после инициализации JS -->
    <div id="app-loading-overlay">
        <div class="loading-bar loading-bar--indeterminate">
            <div class="loading-bar__track"><div class="loading-bar__fill"></div></div>
            <div class="loading-bar__label">Загрузка каталога…</div>
        </div>
    </div>

    {% block content %}{% endblock %}

    <!-- Данные каталога вынесены в отдельный файл для ускорения парсинга HTML -->
    <script src="static/catalog.js?v={{ build_version or '1' }}"></script>

    <!-- JS как внешний файл -->
    <script src="static/main.js?v={{ build_version or '1' }}"></script>
</body>

</html>
